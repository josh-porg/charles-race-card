# Lake Whatcom conditions page: relay the lakeside CWOP weather stations every 15 minutes.
# Writes live.json (and appends history/*.csv) on the whatcom-data branch, which the page reads from
# raw.githubusercontent.com; the site itself (main) is not rebuilt. To stop it: disable this workflow in
# the repository's Actions tab, or delete this file.
name: Lake Whatcom stations relay
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: whatcom-relay
  cancel-in-progress: false
jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: main
      - name: Check out the data branch (created on the first run)
        run: |
          git clone --quiet --depth 1 --branch whatcom-data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data \
            || (mkdir data && cd data && git init --quiet -b whatcom-data && git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git")
      - name: Read the stations
        run: python3 main/relay/whatcom_relay.py data
      - name: Publish
        run: |
          cd data
          git config user.name "whatcom-relay"
          git config user.email "whatcom-relay@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit --quiet -m "Stations $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --quiet origin HEAD:whatcom-data
